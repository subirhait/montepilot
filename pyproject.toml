[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "montepilot"
version = "0.6.2"
description = "Adaptive, device-aware Monte Carlo simulation for statistical research"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Subir Hait" }
]
keywords = [
  "monte-carlo",
  "simulation",
  "statistics",
  "pytorch",
  "gpu",
  "reproducibility"
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics"
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
torch = ["torch>=2.2"]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.7"]
research = ["scipy>=1.12"]

[project.urls]
Homepage = "https://github.com/subirhait/montepilot"
Repository = "https://github.com/subirhait/montepilot"
Documentation = "https://github.com/subirhait/montepilot#readme"
Archive = "https://doi.org/10.5281/zenodo.23127964"

[project.scripts]
montepilot = "montepilot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
